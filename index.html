<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week Six Class Participation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>WeeklyParticipationSix</header>

    <main>
        <h1 id="welcome">Welcome to IT202</h1>

        <p>
            Mouse over the text Show Welcome and the
            Welcome Message is displayed. Mouse out
            and the Welcome Message disappears!
        </p>

        <input type="text" value="Show Welcome"
            onmouseover="showWelcome()"
            onmouseout="hideWelcome()" readonly>
    </main>

    <script src="script.js"></script>
</body>
</html>
